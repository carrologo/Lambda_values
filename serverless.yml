service: my-serverless-api
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_KEY: ${env:SUPABASE_KEY}

plugins:
  - serverless-offline

functions:
  lambdaUtils:
    name: lambdaValues-${opt:stage, 'dev'}
    handler: src/infrastructure/lambdas/handler.getValuesHandler
    events:
      - http:
          path: /values/all
          method: get
          cors: true